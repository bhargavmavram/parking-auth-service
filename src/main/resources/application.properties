spring.application.name=parking-auth-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/parking_db
spring.datasource.username=parking_user
spring.datasource.password=parking_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

parking.jwt.secret=parking-development-secret-key-change-me-please-32bytes-minimum
parking.jwt.issuer=parking-auth-service
parking.jwt.expiration-minutes=60

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always